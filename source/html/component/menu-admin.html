<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Sidebar (Desktop) -->
    <aside class="hidden md:flex flex-col w-1/5 bg-slate-700 p-6 text-white">
      <h1 class="text-xl font-bold mb-10">SisDenWeb</h1>

      <!-- Botão Alterar Senha -->
      <button
        class="btn-change-password mt-6 bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition w-48 mx-auto"
      >
        Alterar Senha
      </button>

      <button
        class="mt-6 bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition w-48 mx-auto"
        onclick='window.location.href = "admin-management.html"'
      >
        Gestão de funcionários
      </button>

      <!-- Botão Dashboard -->
      <button
        class="mt-6 bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition w-48 mx-auto"
        onclick='window.location.href = "./admin-cases.html"'
      >
        Listagem de casos
      </button>

      <!-- Botão Dashboard -->
      <button
        class="mt-6 bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition w-48 mx-auto"
        onclick='window.location.href = "admin-map-cases.html"'
      >
        Mapa de casos
      </button>

      <!-- Botão sair -->
      <button
        class="mt-auto bg-red-500 hover:bg-red-600 w-full py-2 rounded-lg font-medium transition"
        onclick='window.location.href = "../index.html"'
      >
        Sair
      </button>
    </aside>

    <!-- Topbar (Mobile) -->
    <header
      class="md:hidden flex justify-between items-center px-4 py-3 bg-slate-700 text-white"
    >
      <h1 class="text-lg font-semibold">SisDenWeb</h1>
      <button id="menu-toggle">
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </header>

    <!-- Menu Dropdown (Mobile) -->
    <nav
      id="mobile-menu"
      class="md:hidden overflow-hidden max-h-0 opacity-0 dropdown-transition bg-slate-600 text-white"
    >
      <!-- Botão para alterar senha -->
      <button
        class="btn-change-password w-full text-left px-6 py-3 bg-green-600 hover:bg-green-700 transition"
      >
        Alterar Senha
      </button>

      <button
        class="w-full text-left px-6 py-3 bg-blue-600 hover:bg-blue-700 transition"
        onclick='window.location.href = "admin-management.html"'
      >
        Gestão de funcionários
      </button>

      <!-- Botão Dashboard -->
      <button
        class="w-full text-left px-6 py-3 bg-blue-600 hover:bg-blue-700 transition"
        onclick='window.location.href = "admin-cases.html"'
      >
        Listagem de casos
      </button>

      <!-- Botão Dashboard -->
      <button
        class="w-full text-left px-6 py-3 bg-blue-600 hover:bg-blue-700 transition"
        onclick='window.location.href = "./admin-map-cases.html"'
      >
        Mapa de casos
      </button>

      <button
        class="w-full text-left px-6 py-3 bg-red-500 hover:bg-red-600 transition"
        onclick='window.location.href = "../index.html"'
      >
        Sair
      </button>
    </nav>

    <!-- Modal para alterar senha -->
    <div
      id="change-password-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-2xl shadow-lg w-96 p-6">
        <!-- <h2 class="text-lg font-semibold mb-4 text-center">Alterar Senha</h2> -->

        <form id="change-password-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700"
              >Senha Atual</label
            >
            <input
              type="password"
              id="current-password"
              class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring focus:ring-blue-200"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700"
              >Nova Senha</label
            >
            <input
              type="password"
              id="new-password"
              class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring focus:ring-blue-200"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700"
              >Confirmar Nova Senha</label
            >
            <input
              type="password"
              id="confirm-password"
              class="w-full border rounded-lg px-3 py-2 mt-1 focus:ring focus:ring-blue-200"
              required
            />
          </div>

          <div class="flex justify-end space-x-2 mt-6">
            <button
              type="button"
              id="cancel-change-password"
              class="px-3 py-1 rounded-md border border-slate-400 hover:bg-slate-100"
            >
              Cancelar
            </button>
            <button
              type="button"
              id="save-change-password"
              class="px-3 py-1 rounded-md bg-blue-600 text-white hover:bg-blue-700"
            >
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
