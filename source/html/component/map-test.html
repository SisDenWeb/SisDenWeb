<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Barra de pesquisa -->
    <div style="margin-top: 10px; text-align: center; position: relative">
      <input
        type="text"
        id="searchBox"
        placeholder="Digite um endereço..."
        style="
          width: 300px;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 8px;
        "
        oninput="autocompleteEndereco()"
        autocomplete="off"
      />
      <ul
        id="suggestions"
        style="
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          width: 300px;
          background: white;
          border: 1px solid #ccc;
          border-radius: 8px;
          margin-top: 2px;
          list-style: none;
          padding: 0;
          z-index: 10;
          display: none;
          text-align: left;
          max-height: 200px;
          overflow-y: auto;
        "
      ></ul>
    </div>

    <div id="map" style="width: 100%; height: 500px"></div>

    <script>
      //   const map = new maplibregl.Map({
      //     container: "map",
      //     style: "https://tiles.openfreemap.org/styles/liberty",
      //     center: [-50.25, -20.2833], // Fernandópolis - SP
      //     zoom: 13, // nível de aproximação ideal para cidade
      //   });

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "esri-satellite": {
              type: "raster",
              tiles: [
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
              ],
              tileSize: 256,
            },
          },
          layers: [
            {
              id: "esri-satellite",
              type: "raster",
              source: "esri-satellite",
            },
          ],
        },
        center: [-50.25, -20.2833], // Fernandópolis
        zoom: 13,
        maxZoom: 16.4,
      });

      // Adiciona controles de navegação (zoom e rotação)
      map.addControl(new maplibregl.NavigationControl(), "top-right");

      let click_list = [];

      // Escuta cliques no mapa
      map.on("click", (event) => {
        const { lng, lat } = event.lngLat;
        click_list.push([lng, lat]);
        // Exemplo: mostra popup no local clicado
        new maplibregl.Popup().setLngLat([lng, lat]).addTo(map);
      });

      const searchBox = document.getElementById("searchBox");
      const suggestions = document.getElementById("suggestions");

      // Coordenadas centrais de Fernandópolis (para priorizar resultados próximos)
      const fernandopolisCenter = { lat: -20.2833, lon: -50.25 };

      async function autocompleteEndereco() {
        const query = searchBox.value.trim();
        if (query.length < 3) {
          suggestions.style.display = "none";
          return;
        }

        // Extrai o número digitado pelo usuário, se houver
        const numberMatch = query.match(/\b\d+\b/);
        const typedNumber = numberMatch ? numberMatch[0] : null;

        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(
          query
        )}&limit=5&lang=default&lat=${fernandopolisCenter.lat}&lon=${
          fernandopolisCenter.lon
        }`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          suggestions.innerHTML = "";

          // Cria um array de features
          const features = [...data.features];

          // Se houver número digitado, adiciona uma sugestão no topo
          if (typedNumber && features.length > 0) {
            const primeiraRua = features[0];
            const customSuggestion = {
              properties: {
                name: primeiraRua.properties.name,
                city: primeiraRua.properties.city || "Fernandópolis",
                state: primeiraRua.properties.state || "SP",
                house_number: typedNumber,
                custom: true,
              },
              geometry: primeiraRua.geometry,
            };
            features.unshift(customSuggestion);
          }

          if (features.length === 0) {
            suggestions.style.display = "none";
            return;
          }

          features.forEach((f) => {
            const li = document.createElement("li");
            const nomeRua = f.properties.name || "Local";
            const cidade = f.properties.city || f.properties.state || "";

            // Somente usa o número digitado, se for sugestão customizada
            const numero = f.properties.custom
              ? f.properties.house_number
              : null;
            const displayName = numero
              ? `${nomeRua}, ${numero} - ${cidade}`
              : `${nomeRua} - ${cidade}`;

            li.textContent = displayName;
            li.style.padding = "6px 10px";
            li.style.cursor = "pointer";
            li.onmouseenter = () => (li.style.background = "#f0f0f0");
            li.onmouseleave = () => (li.style.background = "white");

            li.onclick = async () => {
              const enderecoCompleto = numero
                ? `${numero}, ${nomeRua}, ${cidade}, ${
                    f.properties.state || "SP"
                  }, Brasil`
                : `${nomeRua}, ${cidade}, ${
                    f.properties.state || "SP"
                  }, Brasil`;

              try {
                console.log(enderecoCompleto);
                const nominatimData = await buscarEnderecoNominatim(
                  enderecoCompleto
                );

                if (nominatimData.length > 0) {
                  searchBox.value = displayName;
                  suggestions.style.display = "none";

                  markers_on_map(nominatimData);
                } else {
                  alert("Endereço não encontrado com precisão.");
                }
              } catch (nErr) {
                console.error("Erro ao buscar no Nominatim:", nErr);
              }
            };

            suggestions.appendChild(li);
          });

          suggestions.style.display = "block";
        } catch (err) {
          console.error("Erro no autocomplete:", err);
          suggestions.style.display = "none";
        }
      }

      let markers = []; // array global para guardar os markers

      function markers_on_map(data) {
        // Remove todos os markers antigos
        markers.forEach((m) => m.remove());
        markers = [];

        // Adiciona novos markers
        // data.forEach((item) => {
        //   const marker = new maplibregl.Marker()
        //     .setLngLat([item.lon, item.lat])
        //     .setPopup(
        //       new maplibregl.Popup().setHTML(`<b>${item.display_name}</b>`)
        //     )
        //     .addTo(map);

        //   markers.push(marker);
        // });

        const marker = new maplibregl.Marker()
          .setLngLat([data[0].lon, data[0].lat])
          .setPopup(
            new maplibregl.Popup().setHTML(`<b>${data[0].display_name}</b>`)
          )
          .addTo(map);

        markers.push(marker);

        // Centraliza mapa no primeiro marker
        if (data.length > 0) {
          map.flyTo({ center: [data[0].lon, data[0].lat], zoom: 17 });
        }
      }

      async function buscarEnderecoNominatim(enderecoCompleto) {
        const viewbox = "-50.300,-20.250,-50.180,-20.320"; // Fernandópolis
        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&viewbox=${viewbox}&bounded=1&q=${encodeURIComponent(
          enderecoCompleto
        )}`;
        console.log(url);

        const res = await fetch(url, {
          headers: { "Accept-Language": "pt-BR" },
        });
        const data = await res.json();

        if (data.length > 0) {
          // Mapeia todos os resultados em objetos consistentes
          return data.map((item) => ({
            lat: parseFloat(item.lat),
            lon: parseFloat(item.lon),
            display_name: item.display_name,
          }));
        } else {
          return null;
        }
      }

      function ativarClickMapa() {
        window.geoClicks = [];
        let marcador = null;

        // Remove event listeners anteriores (caso a função seja chamada mais de uma vez)
        map.off("click");

        // Adiciona listener de clique
        map.on("click", (e) => {
          const lat = e.lngLat.lat.toFixed(8);
          const lon = e.lngLat.lng.toFixed(8);

          // Atualiza campos do formulário
          const campoLat = document.getElementById("geo1");
          const campoLon = document.getElementById("geo2");

          if (campoLat) campoLat.value = lat;
          if (campoLon) campoLon.value = lon;

          console.log("Coordenadas:", { geo1: lat, geo2: lon });
          window.geoClicks.push({ geo1: lat, geo2: lon });

          // Adiciona ou move o marcador
          if (!marcador) {
            marcador = new maplibregl.Marker({ color: "red" })
              .setLngLat([lon, lat])
              .addTo(map);
          } else {
            marcador.setLngLat([lon, lat]);
          }
        });
      }

      //   Oculta sugestões se clicar fora
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#searchBox")) suggestions.style.display = "none";
      });

      window.click_list = () => {
        console.log(JSON.stringify(click_list));
      };

      ativarClickMapa()
    </script>
  </body>
</html>
