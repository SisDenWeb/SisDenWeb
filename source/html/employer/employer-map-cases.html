<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .dropdown-transition {
        transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
      }
      .maplibregl-ctrl button img {
        transition: transform 0.2s, filter 0.2s;
      }

      .maplibregl-ctrl button:hover img {
        transform: scale(1.1);
        filter: brightness(1.2);
      }
    </style>

    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>

  <!-- menu dinamicamente inserido na tag body-->
  <body class="h-screen flex flex-col md:flex-row bg-slate-100 text-slate-900">
    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto relative">
      <div id="caso-container"></div>

      <div id="map" style="width: 100%; height: 100%"></div>

      <div
        id="map-legend"
        class="absolute bottom-4 left-4 bg-white bg-opacity-90 rounded-lg shadow p-3 text-sm border border-slate-300"
      >
        <h3 class="font-semibold text-slate-700 mb-2">Legenda</h3>
        <div class="flex items-center gap-2 mb-1">
          <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
          Dengue
        </div>
        <div class="flex items-center gap-2 mb-1">
          <span class="w-3 h-3 rounded-full bg-orange-400 inline-block"></span>
          Chikungunya
        </div>
      </div>
    </main>

    <script src="../../script/casos.js"></script>
    <script src="../../script/data_handler.js"></script>
    <script src="../../script/map_casos.js"></script>
    <script src="../../script/menu.js"></script>
  </body>
</html>
