<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .dropdown-transition {
        transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
      }
    </style>

    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body class="h-screen flex flex-col md:flex-row bg-slate-100 text-slate-900">
    <!-- Conteúdo Principal -->
    <main class="flex-1 p-6 overflow-y-auto relative">
      <div class="overflow-y-auto h-[calc(100vh-8rem)] pr-2">
        <div class="w-full mb-4">
          <div class="relative box-border w-full">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar caso por nome, ID ou outro termo..."
              class="w-full box-border border border-slate-300 rounded-lg pl-10 pr-10 py-2 focus:ring focus:ring-blue-200 focus:border-blue-500"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-slate-400 absolute left-3 top-2.5 pointer-events-none"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>

            <!-- botão limpar (opcional) alinhado à direita dentro do input -->
            <button
              id="clear-search"
              type="button"
              class="absolute right-2 top-2.5 h-5 w-5 flex items-center justify-center text-slate-400 hover:text-slate-600 hidden"
            >
              ✕
            </button>
          </div>
        </div>

        <!-- Lista de casos -->
        <div id="casos-list" class="space-y-4">
          <!-- Itens adicionados via JS -->
        </div>
      </div>

      <!-- Botão para abrir modal -->
      <button
        onclick="openCaseModal()"
        class="fixed bottom-6 right-6 bg-blue-700 text-white px-4 py-2 rounded shadow-lg hover:bg-blue-800 transition-all z-50"
      >
        Novo Caso
      </button>

      <div id="caso-container"></div>
    </main>

    <script>
      // Filtro simples da lista de casos
      document
        .getElementById("search-input")
        .addEventListener("input", function (e) {
          const termo = e.target.value.toLowerCase();
          const itens = document.querySelectorAll("#casos-list > div");

          itens.forEach((item) => {
            const texto = item.textContent.toLowerCase();
            item.style.display = texto.includes(termo) ? "" : "none";
          });
        });
    </script>

    <script src="../../script/data_handler.js"></script>
    <script src="../../script/casos.js"></script>
    <script src="../../script/menu.js"></script>

    <script>
      let mapModal;
      let markerModal;

      const interval = setInterval(() => {
        const el = document.getElementById("btn-localizacao");
        if (el) {
          init_localizar_model();
          clearInterval(interval);
        }
      }, 100);

      function init_localizar_model() {
        const btnLocalizacao = document.getElementById("btn-localizacao");
        const modalLocalizacao = document.getElementById("modal-localizacao");
        const btnCancelar = document.getElementById("cancel-localizacao");
        const btnSalvar = document.getElementById("save-localizacao");

        btnLocalizacao.addEventListener("click", () => {
          modalLocalizacao.classList.remove("hidden");

          // Inicializa o mapa apenas uma vez
          if (!mapModal) {
            mapModal = new maplibregl.Map({
              container: "map-modal",
              style: {
                version: 8,
                sources: {
                  "esri-satellite": {
                    type: "raster",
                    tiles: [
                      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                    ],
                    tileSize: 256,
                  },
                },
                layers: [
                  {
                    id: "esri-satellite",
                    type: "raster",
                    source: "esri-satellite",
                  },
                ],
              },
              center: [-50.25, -20.2833],
              zoom: 13,
              maxZoom: 16.4,
            });

            mapModal.addControl(
              new maplibregl.NavigationControl(),
              "top-right"
            );

            lat = document.getElementById("res-geo1").value;
            lng = document.getElementById("res-geo2").value;

            if (lat != null && lng != null) {
              markerModal = new maplibregl.Marker({ color: "red" })
                .setLngLat([lng, lat])
                .addTo(mapModal);
            }

            mapModal.on("click", (e) => {
              const coords = e.lngLat;

              if (!markerModal) {
                markerModal = new maplibregl.Marker({ color: "red" })
                  .setLngLat([coords.lng, coords.lat])
                  .addTo(mapModal);
              } else {
                markerModal.setLngLat([coords.lng, coords.lat]);
              }
            });
          } else {
            // Se já existir o mapa, force recalcular tamanho
            mapModal.resize();
          }
        });

        // Cancelar
        btnCancelar.addEventListener("click", () => {
          modalLocalizacao.classList.add("hidden");
        });

        // Salvar
        btnSalvar.addEventListener("click", () => {
          if (markerModal) {
            const { lat, lng } = markerModal.getLngLat();
            document.getElementById("res-geo1").value = lat;
            document.getElementById("res-geo2").value = lng;
          }
          modalLocalizacao.classList.add("hidden");
        });
      }
    </script>
  </body>
</html>
