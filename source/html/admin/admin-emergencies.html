<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb - SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <aside
        id="sidebar"
        data-component="menu_admin"
        class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
      ></aside>

      <!-- Overlay para mobile -->
      <div
        id="overlay"
        class="btn-toggle-sidebar fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"
      ></div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Mobile -->
        <header
          class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between md:hidden"
        >
          <button class="btn-toggle-sidebar p-2 text-3xl">☰</button>
          <h1 class="font-bold text-xl">SisDenWeb</h1>
          <div></div>
        </header>

        <!-- Conteúdo Real -->
        <main class="flex-1 flex items-center justify-center bg-gray-50">
          <div class="text-center">
            <div class="text-6xl mb-6">🚧</div>
            <h2 class="text-2xl font-semibold text-gray-700 mb-2">
              Página em Construção
            </h2>
            <p class="text-gray-500 max-w-xs mx-auto">
              Estamos trabalhando para trazer esta funcionalidade o mais breve
              possível.
            </p>

            <button
              onclick="window.history.back()"
              class="mt-8 px-6 py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 transition"
            >
              Voltar
            </button>
          </div>
        </main>
      </div>
    </div>

    <script type="module">
      import "../../script/pages/admin_page.js";
    </script>
  </body>
</html>
