<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalStorage Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
      <h1 class="text-2xl font-bold mb-6 text-center">
        LocalStorage Debug Panel
      </h1>

      <!-- Lista de itens -->
      <div id="storage-list" class="space-y-4 mb-8"></div>

      <!-- Botão de reset -->
      <div class="text-center">
        <button
          id="reset-storage"
          class="bg-red-600 text-white px-6 py-3 rounded-lg font-semibold text-lg shadow-md hover:bg-red-700 transition"
        >
          Resetar LocalStorage
        </button>
      </div>
    </div>

    <script src="../../script/data_handler.js"></script>

    <script>
      const listContainer = document.getElementById("storage-list");
      const resetButton = document.getElementById("reset-storage");

      // Função para renderizar o localStorage
      function renderLocalStorage() {
        listContainer.innerHTML = "";

        if (localStorage.length === 0) {
          listContainer.innerHTML = `
          <p class="text-center text-slate-500">Nenhum item no localStorage.</p>
        `;
          return;
        }

        Object.keys(localStorage).forEach((key) => {
          const value = localStorage.getItem(key);

          const itemDiv = document.createElement("div");
          itemDiv.className =
            "border border-slate-300 rounded-lg p-4 bg-slate-50 shadow-sm";

          itemDiv.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <h2 class="font-semibold text-lg">${key}</h2>
            <button
              class="text-red-500 hover:text-red-700 font-semibold"
              onclick="removeItem('${key}')"
            >
              Remover
            </button>
          </div>
          <textarea
            id="value-${key}"
            class="w-full border border-slate-300 rounded p-2 font-mono text-sm text-slate-700"
            rows="4"
          >${value}</textarea>
          <button
            class="mt-2 bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700 transition"
            onclick="saveItem('${key}')"
          >
            Salvar Alterações
          </button>
        `;

          listContainer.appendChild(itemDiv);
        });
      }

      // Funções auxiliares
      function removeItem(key) {
        localStorage.removeItem(key);
        renderLocalStorage();
      }

      function saveItem(key) {
        const newValue = document.getElementById(`value-${key}`).value;
        localStorage.setItem(key, newValue);
        alert(`Item "${key}" atualizado com sucesso!`);
      }

      resetButton.addEventListener("click", () => {
        if (confirm("Tem certeza que deseja resetar TODO o localStorage?")) {
          localStorage.clear();
          starter_database(renderLocalStorage);
          alert("LocalStorage resetado!");
        }
      });

      // Render inicial
      renderLocalStorage();
    </script>
  </body>
</html>
