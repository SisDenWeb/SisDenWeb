<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb - SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <aside
        id="sidebar"
        data-component="menu_admin"
        class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
      ></aside>

      <!-- Overlay para mobile -->
      <div
        id="overlay"
        class="btn-toggle-sidebar fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"
      ></div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Mobile -->
        <header
          class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between md:hidden"
        >
          <button class="btn-toggle-sidebar p-2 text-3xl">☰</button>
          <h1 class="font-bold text-xl">SisDenWeb</h1>
          <div></div>
        </header>

        <!-- Conteúdo Real -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
          <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-8">
              <h1 class="text-3xl font-bold text-slate-800">
                Casos Notificados
              </h1>

              <button
                class="btn-abrir-novo-caso bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-medium"
              >
                + Novo Caso
              </button>
            </div>

            <div class="flex items-center gap-3 w-full max-w-7xl mb-4 ">
              <!-- Barra de Pesquisa -->
              <div class="flex-1 relative w-full">
                <input
                  type="text"
                  id="search-casos"
                  placeholder="Buscar casos..."
                  class="w-full px-5 py-3 pl-12 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-sm"
                />
                <div
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                >
                  🔍
                </div>
              </div>

              <!-- Botão de Filtro Avançado -->
              <button
                id="btn-filtro-avancado"
                class="px-5 py-3 bg-white border border-gray-300 hover:border-gray-400 rounded-2xl flex items-center gap-2 text-sm font-medium transition"
              >
                <span>🔧</span>
                <span>Filtros</span>
              </button>
            </div>

            <div id="casos-list" class="space-y-4">
              <!-- JS preenche aqui -->
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal -->
    <div data-component="modal_caso_form"></div>

    <script type="module">
      import "../../script/pages/admin_page.js";
    </script>
  </body>
</html>
