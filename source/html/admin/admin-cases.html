<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .dropdown-transition {
        transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
      }
    </style>

    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body class="h-screen flex flex-col md:flex-row bg-slate-100 text-slate-900">
    <!-- Conteúdo Principal -->
    <main class="flex-1 p-4 md:p-6 overflow-y-auto relative">
      <div class="h-[calc(100vh-7rem)] overflow-y-auto pr-2 space-y-4">
        <!-- Lista de casos dinamicamente -->
        <div id="casos-list" class="space-y-4">
          <!-- Conteúdo inserido via JavaScript -->
        </div>
      </div>

      <!-- Botão flutuante -->
      <button
        onclick="openCaseModal()"
        class="fixed bottom-6 right-6 bg-blue-700 hover:bg-blue-800 text-white px-5 py-3 rounded-xl shadow-md transition-all z-50"
      >
        Novo Caso
      </button>

      <!-- Modal de Ficha de Notificação SUS -->
      <div id="caso-container"></div>
    </main>

    <!-- Scripts -->
    <script src="../../script/data_handler.js"></script>
    <script src="../../script/casos.js"></script>
    <script src="../../script/admin_mobile.js"></script>
    <script src="../../script/menu-admin.js"></script>
    ">

    <script>
      let mapModal;
      let markerModal;
      let currentStyle = "satellite";

      const interval = setInterval(() => {
        const el = document.getElementById("btn-localizacao");
        if (el) {
          init_localizar_model();
          clearInterval(interval);
        }
      }, 100);

      function getMapStyle(type) {
        if (type === "satellite") {
          return {
            version: 8,
            glyphs:
              "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
            sources: {
              "esri-satellite": {
                type: "raster",
                tiles: [
                  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                ],
                tileSize: 256,
              },
            },
            layers: [
              {
                id: "esri-satellite",
                type: "raster",
                source: "esri-satellite",
              },
            ],
          };
        }

        // === OSM com labels ===
        return {
          version: 8,
          glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
          sources: {
            "osm-tiles": {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
            },
            "osm-labels": {
              type: "vector",
              tiles: ["https://demotiles.maplibre.org/tiles/{z}/{x}/{y}.pbf"],
            },
          },
          layers: [
            {
              id: "osm-tiles",
              type: "raster",
              source: "osm-tiles",
            },
            {
              id: "place-labels",
              type: "symbol",
              source: "osm-labels",
              "source-layer": "place",
              layout: {
                "text-field": ["get", "name"],
                "text-size": 12,
                "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
              },
              paint: {
                "text-color": "#000",
                "text-halo-color": "#fff",
                "text-halo-width": 1.5,
              },
            },
          ],
        };
      }

      class ToggleBaseMapControl {
        constructor() {
          this.osmicon = "../../assets/icone_osm.png";
          this.satelliteicon = "../../assets/icone_satellite.png";

          this.container = document.createElement("div");
          this.container.className =
            "maplibregl-ctrl maplibregl-ctrl-group flex items-center justify-center";

          this.button = document.createElement("button");
          this.button.type = "button";
          this.button.className =
            "w-8 h-8 flex items-center justify-center hover:bg-gray-200 transition rounded";

          this.icon = document.createElement("img");
          this.icon.src = this.satelliteicon;
          this.icon.alt = "Alternar camada";
          this.icon.className = "w-5 h-5";
          this.button.appendChild(this.icon);
          this.container.appendChild(this.button);

          this.button.addEventListener("click", () => this.toggleStyle());
        }

        onAdd(mapInstance) {
          this.map = mapInstance;
          return this.container;
        }

        onRemove() {
          this.container.parentNode.removeChild(this.container);
          this.map = undefined;
        }

        toggleStyle() {
          const center = this.map.getCenter();
          const zoom = this.map.getZoom();

          currentStyle = currentStyle === "satellite" ? "osm" : "satellite";
          this.map.setStyle(getMapStyle(currentStyle));

          this.map.once("styledata", () => {
            this.map.setCenter(center);
            this.map.setZoom(zoom);
          });

          // Alterna o ícone
          if (currentStyle === "satellite") {
            this.icon.src = this.satelliteicon;
          } else {
            this.icon.src = this.osmicon;
          }
        }
      }

      function init_localizar_model() {
        const btnLocalizacao = document.getElementById("btn-localizacao");
        const modalLocalizacao = document.getElementById("modal-localizacao");
        const btnCancelar = document.getElementById("cancel-localizacao");
        const btnSalvar = document.getElementById("save-localizacao");

        btnLocalizacao.addEventListener("click", () => {
          modalLocalizacao.classList.remove("hidden");

          // Inicializa o mapa apenas uma vez
          if (!mapModal) {
            console.log("Criando novo mapa");

            lat = document.getElementById("res-geo1").value;
            lng = document.getElementById("res-geo2").value;

            if (lat == null || lat == "") {
              lat = -20.2833;
            }
            if (lng == null || lng == "") {
              lng = -50.25;
            }

            mapModal = new maplibregl.Map({
              container: "map-modal",
              style: getMapStyle("satellite"),
              center: [lng, lat], // Fernandópolis - SP
              zoom: 16.4,
              maxZoom: 16.4,
            });

            mapModal.addControl(
              new maplibregl.NavigationControl(),
              "top-right"
            );

            mapModal.addControl(new ToggleBaseMapControl(), "top-right");

            if (lat != null && lng != null) {
              markerModal = new maplibregl.Marker({ color: "red" })
                .setLngLat([lng, lat])
                .addTo(mapModal);
            }

            mapModal.on("click", (e) => {
              const coords = e.lngLat;

              if (!markerModal) {
                markerModal = new maplibregl.Marker({ color: "red" })
                  .setLngLat([coords.lng, coords.lat])
                  .addTo(mapModal);
              } else {
                markerModal.setLngLat([coords.lng, coords.lat]);
              }
            });
          } else {
            // Se já existir o mapa, force recalcular tamanho
            mapModal.resize();
          }
        });

        // Cancelar
        btnCancelar.addEventListener("click", () => {
          modalLocalizacao.classList.add("hidden");
        });

        // Salvar
        btnSalvar.addEventListener("click", () => {
          if (markerModal) {
            const { lat, lng } = markerModal.getLngLat();
            document.getElementById("res-geo1").value = lat;
            document.getElementById("res-geo2").value = lng;
          }
          modalLocalizacao.classList.add("hidden");
        });
      }
    </script>
  </body>
</html>
