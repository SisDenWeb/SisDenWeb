<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2196f3" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      input,
      select,
      textarea {
        font-size: 16px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center px-4"
  >
    <main
      class="w-full max-w-md bg-white p-8 rounded-lg shadow-xl border border-blue-200"
    >
      <div class="flex flex-col items-center mb-6">
        <img
          src="../assets/SisDenWeb-2.0.jpeg"
          alt="Logo SisDenWeb"
          class="object-contain"
        />
        <p class="text-sm text-gray-500">Sistema de Notificação de Casos</p>
      </div>

      <form class="space-y-5" aria-label="Formulário de login">
        <!-- Formulário de login -->
        <div id="login-form">
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700"
              >Email</label
            >
            <input
              type="email"
              id="login-email"
              class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              autocomplete="email"
              required
              placeholder="seu@email.com"
            />
          </div>

          <div>
            <label for="senha" class="block text-sm font-medium text-slate-700"
              >Senha</label
            >
            <div class="relative">
              <input
                type="password"
                id="login-senha"
                class="mt-1 w-full px-4 py-2 pr-10 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                autocomplete="current-password"
                placeholder="Senha"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500"
                aria-label="Mostrar ou ocultar senha"
              >
                <svg
                  id="eye-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <!-- Ícone de olho -->
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5
                  c4.477 0 8.268 2.943 9.542 7
                  -1.274 4.057-5.065 7-9.542 7
                  -4.477 0-8.268-2.943-9.542-7z"
                  />
                  <!-- Linha diagonal para cortar o olho -->
                  <line
                    id="eye-slash"
                    x1="4"
                    y1="4"
                    x2="20"
                    y2="20"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    class="hidden"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Mensagem de erro -->
          <p id="login-error" class="text-red-600 text-sm mt-2 hidden"></p>

          <button
            type="button"
            id="login-buttom"
            class="w-full bg-blue-600 text-white py-2 px-4 mt-2 rounded-lg font-semibold hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500"
            onclick="fazerLogin()"
          >
            Entrar
          </button>


          <button
            type="button"
            id="login-buttom"
            class="w-full bg-blue-600 text-white py-2 px-4 my-1 rounded-lg font-semibold hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500"
            onclick="toggleForms()"
          >
            Cadastrar como paciente
          </button>

          <div style="text-align: center; margin-top: 16px; font-size: 0.95rem">
            Dificuldades com a senha?
            <a
              href="#"
              onclick="
                toggleResetForms();
                return false;
              "
              style="color: #4285f4; font-weight: 500"
            >
              Redefina
            </a>
          </div>
        </div>

        <!-- Formulário de cadastro -->
        <div id="signup-form" class="hidden">
          <div>
            <label for="nome" class="block text-sm font-medium text-slate-700"
              >Nome completo</label
            >
            <input
              type="text"
              id="signup-nome"
              class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Nome completo"
              autocomplete="nome completo"
              required
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700"
              >Email</label
            >
            <input
              type="email"
              id="signup-email"
              class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div>
            <label for="senha" class="block text-sm font-medium text-slate-700"
              >Senha</label
            >
            <div class="relative">
              <input
                type="password"
                id="signup-senha"
                class="mt-1 w-full px-4 py-2 pr-10 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                autocomplete="current-password"
                placeholder="Senha"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500"
                aria-label="Mostrar ou ocultar senha"
              >
                <svg
                  id="eye-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <!-- Ícone de olho -->
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5
                  c4.477 0 8.268 2.943 9.542 7
                  -1.274 4.057-5.065 7-9.542 7
                  -4.477 0-8.268-2.943-9.542-7z"
                  />
                  <!-- Linha diagonal para cortar o olho -->
                  <line
                    id="eye-slash"
                    x1="4"
                    y1="4"
                    x2="20"
                    y2="20"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    class="hidden"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Mensagem de erro -->
          <p id="signup-error" class="text-red-600 text-sm mt-2 hidden"></p>

          <button
            type="button"
            id="signup-buttom"
            class="w-full bg-blue-600 text-white py-2 px-4 my-2 rounded-lg font-semibold hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500"
            onclick="fazerCadastro()"
          >
            Cadastrar como paciente
          </button>

          <p style="text-align: center; margin-top: 16px">
            Já tem conta?
            <a
              href="#"
              onclick="
                toggleForms();
                return false;
              "
              style="color: #4285f4"
              >Entrar</a
            >
          </p>
        </div>

        <!-- Formulário de redefinição de senha -->
        <div id="reset-password-form" class="hidden">
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700"
              >Email</label
            >
            <input
              type="email"
              id="reset-email"
              class="mt-1 w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <!-- Mensagem de erro -->
          <p id="signup-error" class="text-red-600 text-sm mt-2 hidden"></p>

          <button
            type="button"
            id="signup-buttom"
            class="w-full bg-blue-600 text-white py-2 px-4 my-2 rounded-lg font-semibold hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500"
            onclick="resetPassword()"
          >
            Enviar Link de Redefinição
          </button>

          <p style="text-align: center; margin-top: 16px">
            Deseja voltar para o login?
            <a
              href="#"
              onclick="
                toggleResetForms();
                return false;
              "
              style="color: #4285f4"
              >Voltar</a
            >
          </p>
        </div>


        <button
          type="button"
          id="btnInstall"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Instalar App
        </button>
      </form>

      <footer class="mt-6 text-xs text-center text-gray-500">
        Copyright &copy; 2025 <strong>Univesp PI</strong><br />
        Todos os direitos reservados.
      </footer>
    </main>
  </body>
</html>

<!-- Scripts em ordem: config primeiro, depois lógica -->
<script type="module">
  import "../script/config-firebase.js";
  import "../script/auth.js";
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker
      .register("/service-worker.js")
      .then(() => console.log("Service Worker registrado!"))
      .catch((err) => console.log("Erro ao registrar Service Worker:", err));
  }

  let deferredPrompt;
  const btnInstall = document.getElementById("btnInstall");

  // Escuta o evento disparado pelo navegador
  window.addEventListener("beforeinstallprompt", (e) => {
    console.log("event: beforeinstallprompt");
    e.preventDefault(); // Impede o prompt automático
    deferredPrompt = e; // Guarda o evento
  });

  // Quando o usuário clicar no botão
  btnInstall.addEventListener("click", async () => {
    console.log("event: click on install button");
    if (deferredPrompt) {
      console.log("deferredPrompt = true");
      console.log("deferredPrompt = " + deferredPrompt);
      deferredPrompt.prompt(); // Mostra o prompt de instalação
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Usuário escolheu: ${outcome}`);
      deferredPrompt = null;
      btnInstall.style.display = "none"; // Esconde o botão
    } else if (deferredPrompt == undefined) {
      console.log("deferredPrompt não definido!");
    } else {
      console.log(deferredPrompt);
    }
  });

  function isPWAInstalled() {
    return (
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true
    );
  }

  if (isPWAInstalled) {
    btnInstall.style.display = "none";
  }
</script>
