<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb - SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <aside
        id="sidebar"
        data-component="menu_funcionario"
        class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
      ></aside>

      <!-- Overlay para mobile -->
      <div
        id="overlay"
        class="btn-toggle-sidebar fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"
      ></div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Mobile -->
        <header
          class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between md:hidden"
        >
          <button class="btn-toggle-sidebar p-2 text-3xl">☰</button>
          <h1 class="font-bold text-xl">SisDenWeb</h1>
          <div></div>
        </header>

        <!-- Conteúdo Real -->
        <main id="lista-de-denuncias" class="flex-1 overflow-auto">
          <div class="w-full h-screen max-w-5xl mx-auto mt-8">
            <iframe
              src="https://sisdenweb3sos.web.app/admin.html"
              class="w-full h-full rounded-3xl border border-gray-200 shadow-xl"
              title="Página incorporada"
              allowfullscreen
              loading="lazy"
            ></iframe>
          </div>
        </main>
      </div>
    </div>

    <script type="module">
      import "../../script/pages/funcionario_page.js";
    </script>
  </body>
</html>
