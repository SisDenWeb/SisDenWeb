<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .dropdown-transition {
        transition:
          max-height 0.3s ease-in-out,
          opacity 0.3s ease-in-out;
      }
      .maplibregl-ctrl button img {
        transition:
          transform 0.2s,
          filter 0.2s;
      }

      .maplibregl-ctrl button:hover img {
        transform: scale(1.1);
        filter: brightness(1.2);
      }

      .custom-case-popup .maplibregl-popup-content {
        padding: 0 !important;
        border: none !important; /* Remove borda cinza */
        border-radius: 16px !important;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4) !important;
        overflow: hidden;
      }

      .custom-case-popup .maplibregl-popup-tip {
        display: none !important; /* Remove a seta (tip) do popup */
      }
    </style>

    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <aside
        id="sidebar"
        data-component="menu_funcionario"
        class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
      ></aside>

      <!-- Overlay para mobile -->
      <div
        id="overlay"
        class="btn-toggle-sidebar fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"
      ></div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Mobile -->
        <header
          class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between md:hidden"
        >
          <button class="btn-toggle-sidebar p-2 text-3xl">☰</button>
          <h1 class="font-bold text-xl">SisDenWeb</h1>
          <div></div>
        </header>

        <main class="flex-1 overflow-y-auto relative">
          <div id="caso-container"></div>

          <div id="map" style="width: 100%; height: 100%"></div>

          <div
            id="map-legend"
            class="absolute bottom-4 left-4 bg-white bg-opacity-90 rounded-lg shadow p-3 text-sm border border-slate-300"
          >
            <h3 class="font-semibold text-slate-700 mb-2">Legenda</h3>
            <div class="flex items-center gap-2 mb-1">
              <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
              Dengue
            </div>
            <div class="flex items-center gap-2 mb-1">
              <span
                class="w-3 h-3 rounded-full bg-orange-400 inline-block"
              ></span>
              Chikungunya
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal -->
    <div data-component="modal_caso_form"></div>

    <script type="module">
      import "../../script/pages/funcionario_page.js";
    </script>
  </body>
</html>
