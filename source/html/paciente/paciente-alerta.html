<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisDenWeb - SisDenWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 h-screen overflow-hidden">
    <div class="flex h-full">
      <aside
        id="sidebar"
        data-component="menu_paciente"
        class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
      ></aside>

      <!-- Overlay para mobile -->
      <div
        id="overlay"
        class="btn-toggle-sidebar fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"
      ></div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar Mobile -->
        <header
          class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between md:hidden"
        >
          <button class="btn-toggle-sidebar p-2 text-3xl">☰</button>
          <h1 class="font-bold text-xl">SisDenWeb</h1>
          <div></div>
        </header>

        <!-- Conteúdo Real -->
        <main class="min-h-screen bg-gray-50 pb-20">
          <div id="view-lista-denuncia-paciente">
            <div class="max-w-4xl mx-auto px-6 py-8">
              <!-- Cabeçalho -->
              <div class="flex justify-between items-center mb-10">
                <div>
                  <h1 class="text-3xl font-bold text-gray-800">
                    Minhas Denúncias
                  </h1>
                  <p class="text-gray-500 mt-1">
                    Acompanhe o andamento das suas solicitações
                  </p>
                </div>
              </div>

              <!-- Lista de Denúncias -->
              <div id="denuncias-paciente-list" class="space-y-6">
                <!-- Renderizado via JavaScript -->
              </div>
            </div>

            <button
              class="btn-nova-denuncia fixed bottom-8 right-8 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white rounded-3xl shadow-2xl flex items-center gap-3 px-7 py-4 transition-all duration-300 hover:scale-105 focus:outline-none z-50"
            >
              <span class="text-2xl">🚨</span>
              <span class="font-semibold text-base">Nova Denúncia</span>
            </button>
          </div>

          <div
            id="view-formulario-denuncia-paciente"
            class="hidden h-[100dvh] overflow-y-auto bg-white"
          >
            <div
              class="max-w-4xl mx-auto px-6 py-2 flex items-center justify-between"
            >
              <div class="flex items-center gap-4">
                <div>
                  <h2 class="text-2xl font-bold text-gray-800">
                    Nova Denúncia
                  </h2>
                  <p class="text-sm text-gray-500">
                    Descreva o problema que você observou
                  </p>
                </div>
              </div>
            </div>

            <div class="max-w-4xl mx-auto px-6 py-2">
              <form id="denuncia-form" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2"
                      >Nome Completo</label
                    >
                    <input
                      type="text"
                      id="nome-paciente"
                      class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100"
                      placeholder="Seu nome completo"
                      required
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2"
                      >Telefone para Contato</label
                    >
                    <input
                      type="tel"
                      id="telefone"
                      class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100"
                      placeholder="(XX) XXXXX-XXXX"
                    />
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Tipo de Problema</label
                  >
                  <select
                    id="tipo-problema"
                    class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100 bg-white"
                  >
                    <option value="">Selecione o tipo de denúncia...</option>
                    <option value="foco">Foco de mosquito ou larvas</option>
                    <option value="sintomas">
                      Alguém com sintomas suspeitos
                    </option>
                    <option value="criadouro">
                      Criadouro em terreno baldio
                    </option>
                    <option value="outros">Outro problema relacionado</option>
                  </select>
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Descrição do Problema</label
                  >
                  <textarea
                    id="descricao-denuncia"
                    rows="8"
                    class="w-full px-5 py-4 border border-gray-300 rounded-3xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100 resize-y"
                    placeholder="Descreva detalhadamente o que você observou..."
                    required
                  ></textarea>
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Endereço Aproximado</label
                  >
                  <input
                    type="text"
                    id="endereco"
                    class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100"
                    placeholder="Rua, número, bairro, referência..."
                  />
                </div>

                <!-- Botões de ação fixos no final -->
                <div
                  class="flex flex-col md:flex-row gap-4 pt-12 pb-10 border-t"
                >
                  <button
                    type="button"
                    class="btn-cancelar-denuncia flex-1 py-4 text-gray-700 font-medium border border-gray-300 rounded-2xl hover:bg-gray-50 transition"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    class="btn-enviar-denuncia flex-1 py-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-2xl transition"
                  >
                    Enviar Denúncia
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>

        
      </div>
    </div>

    <script type="module">
      import "../../script/pages/paciente_page.js";
    </script>
  </body>
</html>
